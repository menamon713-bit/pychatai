<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chat - مساعد ذكي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #0a0a0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 12px 16px;
            border-bottom: 1px solid #2a2a3a;
            text-align: center;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            flex-shrink: 0;
        }
        .header h1 {
            font-size: clamp(16px, 4vw, 22px);
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }
        .header p {
            font-size: clamp(11px, 3vw, 13px);
            color: #9ca3af;
            margin-top: 4px;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            -webkit-overflow-scrolling: touch;
        }
        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb {
            background: #2a2a3a;
            border-radius: 3px;
        }
        .empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            text-align: center;
            padding: 20px;
        }
        .empty-icon {
            font-size: clamp(48px, 15vw, 80px);
            margin-bottom: 16px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .empty p:first-of-type {
            font-size: clamp(14px, 4vw, 18px);
            font-weight: 600;
            color: #9ca3af;
        }
        .empty p:last-of-type {
            font-size: clamp(12px, 3vw, 14px);
            margin-top: 6px;
        }
        .message {
            display: flex;
            max-width: 90%;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-self: flex-end; }
        .message.assistant { align-self: flex-start; }
        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: clamp(13px, 3.5vw, 15px);
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .user .bubble {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #fff;
            border-bottom-left-radius: 4px;
            box-shadow: 0 3px 10px rgba(99, 102, 241, 0.25);
        }
        .assistant .bubble {
            background: #1a1a2e;
            color: #e5e7eb;
            border: 1px solid #2a2a3a;
            border-bottom-right-radius: 4px;
        }
        .typing {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: #1a1a2e;
            border: 1px solid #2a2a3a;
            border-radius: 18px;
        }
        .typing span {
            width: 6px;
            height: 6px;
            background: #6366f1;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        .input-area {
    padding: 8px 10px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    border-top: 1px solid #2a2a3a;
    background: #0a0a0f;
    flex-shrink: 0;
}
        .input-wrapper {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    gap: 6px;
    background: #1a1a2e;
    border-radius: 22px;
    padding: 4px 6px 4px 14px;
    border: 1px solid #2a2a3a;
    transition: 0.2s;
    align-items: center;
    min-height: 48px;
}
        .input-wrapper:focus-within {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            padding: 10px 0;
            font-size: 15px;
            outline: none;
            min-width: 0;
        }
        input::placeholder { color: #6b7280; font-size: 14px; }
        button {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: #fff;
    border: none;
    border-radius: 18px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    white-space: nowrap;
    flex-shrink: 0;
    min-height: 38px;
}
        button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        button:active:not(:disabled) { transform: scale(0.98); }
        button:disabled {
            background: #2a2a3a;
            color: #6b7280;
            cursor: not-allowed;
        }

        /* للشاشات الصغيرة (موبايل) */
        @media (max-width: 480px) {
            .bubble { max-width: 100%; }
            .message { max-width: 95%; }
            .input-wrapper { padding: 3px 3px 3px 12px; }
            button { padding: 10px 16px; font-size: 13px; }
        }

        /* للشاشات الكبيرة (لابتوب/ديسكتوب) */
        @media (min-width: 768px) {
            .header { padding: 18px 20px; }
            .messages { padding: 24px; gap: 14px; }
            .bubble { padding: 14px 20px; border-radius: 20px; }
            .message { max-width: 70%; }
            .input-area { padding: 16px 24px 20px; }
            .input-wrapper { padding: 6px 6px 6px 20px; }
            input[type="text"] { padding: 12px 0; font-size: 16px; }
            button { padding: 12px 24px; font-size: 15px; }
            .empty-icon { font-size: 96px; }
        }

        /* للشاشات العريضة جدًا */
        @media (min-width: 1200px) {
            .message { max-width: 60%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🤖 AI Chat</h1>
        <p>مساعدك الذكي بالعربي</p>
    </div>

    <div class="messages" id="messages">
        <div class="empty" id="empty">
            <div class="empty-icon">💬</div>
            <p>ابدأ محادثة جديدة</p>
            <p>اسأل أي حاجة، وأنا هساعدك</p>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="input" placeholder="اكتب رسالتك..." autocomplete="off">
            <button id="send">إرسال</button>
        </div>
    </div>

    <script>
        const messages = [];
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const emptyEl = document.getElementById('empty');

        function addMessage(role, content) {
            if (emptyEl) emptyEl.style.display = 'none';
            const div = document.createElement('div');
            div.className = 'message ' + role;
            const rendered = role === 'assistant' ? marked.parse(content) : escapeHtml(content);
div.innerHTML = '<div class="bubble">' + rendered + '</div>';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message assistant';
            div.id = 'typing';
            div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideTyping() {
            const t = document.getElementById('typing');
            if (t) t.remove();
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;

            inputEl.value = '';
            inputEl.disabled = true;
            sendBtn.disabled = true;

            addMessage('user', text);
            messages.push({ role: 'user', content: text });
            showTyping();

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: messages })
                });
                const data = await res.json();
                hideTyping();

                const reply = data.reply || data.error || 'حصل خطأ';
                addMessage('assistant', reply);
                messages.push({ role: 'assistant', content: reply });
            } catch (e) {
                hideTyping();
                addMessage('assistant', '❌ حصل خطأ، حاول تاني');
            }

            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }

        sendBtn.onclick = sendMessage;
        inputEl.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
        inputEl.focus();
    </script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
</script>
</body>
</html>
